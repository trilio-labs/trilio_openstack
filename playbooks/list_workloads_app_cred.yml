---
# Example: Listing Trilio Workloads using Keystone Application Credentials
#
# Application Credentials provide short- or long-lived service tokens tied to a project,
# eliminating the need to expose user passwords in automation pipelines.

- name: Query Trilio Workloads using Keystone Application Credentials
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Fetch workloads using application credentials
      trilio.trilio_openstack.workload_info:
        auth_type: v3applicationcredential
        auth:
          auth_url: "{{ lookup('ansible.builtin.env', 'OS_AUTH_URL') }}"
          application_credential_id: "{{ lookup('ansible.builtin.env', 'OS_APPLICATION_CREDENTIAL_ID') | default(omit, true) }}"
          application_credential_name: "{{ lookup('ansible.builtin.env', 'OS_APPLICATION_CREDENTIAL_NAME') | default(omit, true) }}"
          application_credential_secret: "{{ lookup('ansible.builtin.env', 'OS_APPLICATION_CREDENTIAL_SECRET') }}"
        region_name: "{{ lookup('ansible.builtin.env', 'OS_REGION_NAME') | default(omit, true) }}"
        validate_certs: "{{ (lookup('ansible.builtin.env', 'OS_INSECURE') | lower != 'true') and (lookup('ansible.builtin.env', 'OS_VERIFY') | default('true', true) | bool) }}"
        ca_cert: "{{ lookup('ansible.builtin.env', 'OS_CACERT') | default(omit, true) }}"
      register: workload_result

    - name: Display discovered workloads
      ansible.builtin.debug:
        var: workload_result.workloads
